document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

es New Roman', serif;\n  --font-accent:  'Roseritta', cursive;\n\n  /* Scale */\n  --text-2xs:     11px;  /* legal, micro-labels */\n  --text-xs:      12px;  /* badges, eyebrows */\n  --text-sm:      14px;  /* buttons, secondary copy */\n  --text-base:    16px;  /* body */\n  --text-lg:      19px;  /* lead paragraphs */\n  --text-xl:      24px;  /* card titles, h3 */\n  --text-2xl:     32px;  /* section headings, h2 */\n  --text-3xl:     44px;  /* page titles, h1 */\n  --text-display: 60px;  /* hero statements */\n\n  /* Tracking — uppercase always gets air */\n  --tracking-tight: -0.01em;\n  --tracking-base:  0;\n  --tracking-wide:  0.08em;   /* uppercase buttons, badges */\n  --tracking-caps:  0.18em;   /* eyebrows, nav, micro-labels */\n\n  /* Leading */\n  --leading-tight:   1.12;  /* display, headings */\n  --leading-snug:    1.3;\n  --leading-normal:  1.55;  /* body */\n  --leading-relaxed: 1.7;   /* long-form reading */\n}\n\n/* AME Esencial — spacing, radii, borders, shadows, motion\n   Editorial restraint: square corners, hairline borders, almost no shadow.\n   Generous whitespace is the main layout device. */\n\n:root {\n  /* Spacing — 4px base */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* Radii — sharp by default */\n  --radius-none: 0;\n  --radius-xs:   2px;    /* inputs, buttons — barely softened */\n  --radius-pill: 999px;  /* badges/pills only */\n\n  /* Borders */\n  --border-hairline: 1px solid var(--border-subtle);\n  --border-line:     1px solid var(--border-default);\n  --border-key:      1px solid var(--border-strong);\n\n  /* Shadows — used sparingly, only for floating layers */\n  --shadow-card:    0 1px 2px rgba(13, 13, 13, 0.05);\n  --shadow-lift:    0 8px 28px rgba(13, 13, 13, 0.10);\n  --shadow-overlay: 0 16px 56px rgba(13, 13, 13, 0.18);\n\n  /* Motion — quiet fades, no bounce */\n  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --duration-fast: 140ms; /* @kind other */\n  --duration-base: 220ms; /* @kind other */\n  --duration-slow: 400ms; /* @kind other */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-pad: 24px;\n}\n\n/* AME Esencial — base element styles */\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-primary);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  line-height: var(--leading-tight);\n  margin: 0;\n}\n\np { margin: 0; text-wrap: pretty; }\n\na {\n  color: inherit;\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  text-decoration-thickness: 1px;\n  transition: opacity var(--duration-fast) var(--ease-out);\n}\na:hover { opacity: 0.6; }\n\n::selection { background: var(--ink-950); color: var(--paper); }\n\n/* Accent word — Roseritta flourish inside a heading */\n.ame-accent {\n  font-family: var(--font-accent);\n  font-weight: 400;\n  font-style: normal;\n}\n\n/* Eyebrow — tracked uppercase micro-label above headings */\n.ame-eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* AME Esencial — component classes\n   Consumed by the React primitives in components/. */\n\n/* ============ Button ============ */\n.ame-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  text-decoration: none;\n  border-radius: var(--radius-xs);\n  border: 1px solid transparent;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: background var(--duration-fast) var(--ease-out),\n              color var(--duration-fast) var(--ease-out),\n              border-color var(--duration-fast) var(--ease-out),\n              opacity var(--duration-fast) var(--ease-out);\n}\n.ame-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }\n.ame-btn:active:not(:disabled) { transform: translateY(1px); }\n.ame-btn:disabled { cursor: not-allowed; }\n\n.ame-btn--md { height: 44px; padding: 0 var(--space-6); }\n.ame-btn--sm { height: 36px; padding: 0 var(--space-4); font-size: var(--text-xs); }\n.ame-btn--lg { height: 52px; padding: 0 var(--space-8); }\n.ame-btn--full { width: 100%; }\n\n.ame-btn--primary { background: var(--ink-950); color: var(--text-inverse); border-color: var(--ink-950); }\n.ame-btn--primary:hover:not(:disabled) { background: var(--hover-fill); border-color: var(--hover-fill); }\n.ame-btn--primary:disabled { background: var(--disabled-bg); border-color: var(--disabled-bg); color: var(--disabled-fg); }\n\n.ame-btn--secondary { background: transparent; color: var(--text-primary); border-color: var(--border-strong); }\n.ame-btn--secondary:hover:not(:disabled) { background: var(--ink-950); color: var(--text-inverse); }\n.ame-btn--secondary:disabled { border-color: var(--border-default); color: var(--disabled-fg); }\n\n.ame-btn--ghost { background: transparent; color: var(--text-primary); border-color: transparent; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }\n.ame-btn--ghost:hover:not(:disabled) { opacity: 0.55; }\n.ame-btn--ghost:disabled { color: var(--disabled-fg); }\n\n.ame-btn--inverse { background: var(--paper); color: var(--ink-950); border-color: var(--paper); }\n.ame-btn--inverse:hover:not(:disabled) { background: var(--ink-100); border-color: var(--ink-100); }\n\n/* ============ Input / Select / Textarea ============ */\n.ame-field { display: flex; flex-direction: column; gap: var(--space-2); }\n.ame-field__label {\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-secondary);\n}\n.ame-field__control {\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  color: var(--text-primary);\n  background: var(--surface-page);\n  border: 1px solid var(--border-default);\n  border-radius: var(--radius-xs);\n  height: 44px;\n  padding: 0 var(--space-4);\n  transition: border-color var(--duration-fast) var(--ease-out);\n  width: 100%;\n}\ntextarea.ame-field__control { height: auto; min-height: 96px; padding: var(--space-3) var(--space-4); resize: vertical; }\n.ame-field__control::placeholder { color: var(--text-muted); }\n.ame-field__control:hover { border-color: var(--ink-400); }\n.ame-field__control:focus { outline: none; border-color: var(--border-strong); }\n.ame-field__control:disabled { background: var(--surface-soft); color: var(--disabled-fg); cursor: not-allowed; }\n.ame-field__hint { font-size: var(--text-xs); color: var(--text-muted); }\n.ame-field--error .ame-field__control { border-color: var(--ink-950); }\n.ame-field--error .ame-field__hint { color: var(--ink-950); font-style: italic; }\n\n.ame-select { position: relative; }\n.ame-select select { appearance: none; cursor: pointer; padding-right: var(--space-10); }\n.ame-select::after {\n  content: \"\";\n  position: absolute;\n  right: var(--space-4);\n  top: 50%;\n  width: 7px; height: 7px;\n  border-right: 1px solid var(--ink-950);\n  border-bottom: 1px solid var(--ink-950);\n  transform: translateY(-70%) rotate(45deg);\n  pointer-events: none;\n}\n\n/* ============ Badge ============ */\n.ame-badge {\n  display: inline-flex;\n  align-items: center;\n  height: 22px;\n  padding: 0 var(--space-2);\n  font-size: var(--text-2xs);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  border-radius: var(--radius-none);\n  white-space: nowrap;\n}\n.ame-badge--solid   { background: var(--ink-950); color: var(--text-inverse); }\n.ame-badge--outline { background: var(--paper); color: var(--ink-950); border: 1px solid var(--ink-950); }\n.ame-badge--muted   { background: var(--ink-100); color: var(--ink-700); }\n\n/* ============ Section heading ============ */\n.ame-section-heading { text-align: center; display: grid; gap: var(--space-3); justify-items: center; }\n.ame-section-heading h2 { font-size: var(--text-2xl); letter-spacing: var(--tracking-wide); text-transform: uppercase; }\n.ame-section-heading--left { text-align: left; justify-items: start; }\n.ame-section-heading .ame-accent { text-transform: none; font-size: 1.25em; line-height: 0; vertical-align: -0.08em; }\n\n/* ============ Product card ============ */\n.ame-product-card {\n  display: flex;\n  flex-direction: column;\n  gap: var(--space-3);\n  background: var(--surface-card);\n  text-align: left;\n}\n.ame-product-card__media {\n  position: relative;\n  aspect-ratio: 1;\n  background: var(--surface-soft);\n  overflow: hidden;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.ame-product-card__media img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--duration-slow) var(--ease-out); }\n.ame-product-card:hover .ame-product-card__media img { transform: scale(1.03); }\n.ame-product-card__placeholder { width: 38%; opacity: 0.12; }\n.ame-product-card__badges { position: absolute; top: var(--space-3); left: var(--space-3); display: flex; gap: var(--space-2); }\n.ame-product-card__name {\n  font-size: var(--text-sm);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  line-height: var(--leading-snug);\n}\n.ame-product-card__name a { text-decoration: none; }\n.ame-product-card__name a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }\n.ame-product-card--soldout .ame-product-card__media img,\n.ame-product-card--soldout .ame-product-card__placeholder { opacity: 0.35; filter: grayscale(1); }\n\n/* ============ Price block ============ */\n.ame-price { display: grid; gap: 2px; }\n.ame-price__row { display: flex; align-items: baseline; gap: var(--space-2); }\n.ame-price__current { font-size: var(--text-lg); }\n.ame-price__compare { font-size: var(--text-sm); color: var(--text-muted); text-decoration: line-through; }\n.ame-price__off { font-size: var(--text-2xs); letter-spacing: var(--tracking-wide); }\n.ame-price__note { font-size: var(--text-xs); color: var(--text-muted); }\n.ame-price--lg .ame-price__current { font-size: var(--text-2xl); }\n.ame-price--lg .ame-price__compare { font-size: var(--text-base); }\n.ame-price--lg .ame-price__note { font-size: var(--text-sm); }\n\n/* ============ Quantity stepper ============ */\n.ame-stepper {\n  display: inline-flex;\n  align-items: stretch;\n  border: 1px solid var(--border-strong);\n  border-radius: var(--radius-xs);\n  height: 44px;\n}\n.ame-stepper button {\n  width: 44px;\n  border: none;\n  background: transparent;\n  font-family: var(--font-body);\n  font-size: var(--text-lg);\n  cursor: pointer;\n  color: var(--text-primary);\n  transition: background var(--duration-fast) var(--ease-out);\n}\n.ame-stepper button:hover:not(:disabled) { background: var(--hover-tint); }\n.ame-stepper button:disabled { color: var(--disabled-fg); cursor: not-allowed; }\n.ame-stepper span {\n  min-width: 44px;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  font-size: var(--text-base);\n  border-left: 1px solid var(--border-subtle);\n  border-right: 1px solid var(--border-subtle);\n}\n\n<\u002Fstyle>\n  <script src=\"85d80be3-1828-4dcd-b405-34df425828c6\"><\u002Fscript>\n  <script src=\"c09eca89-6fa2-46da-bfc5-28ab772aea06\"><\u002Fscript>\n  <meta name=\"theme-color\" content=\"#0d0d0d\">\n  <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n  <meta name=\"apple-mobile-web-app-title\" content=\"Envíos AME\">\n  <title>Envíos AME<\u002Ftitle>\n  <script>\n    if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {\n      if (!document.querySelector('link[rel=manifest]')) { var m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.json'; document.head.appendChild(m); var a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = 'camion-192.png'; document.head.appendChild(a); }\n      navigator.serviceWorker.register('sw.js').catch(function () {});\n    }\n  <\u002Fscript>\n  <style>\n    body { margin: 0; background: #f2f2f2; }\n    a { color: #0d0d0d; } a:hover { opacity: .6; }\n    @page { size: 4in 6in; margin: 0; }\n    @media print {\n      body { background: #fff; }\n      [data-noprint] { display: none !important; }\n      [data-print-root] { display: block !important; padding: 0 !important; background: #fff !important; min-height: 0 !important; }\n      [data-labels] { display: block !important; padding: 0 !important; gap: 0 !important; }\n      [data-label-page] { outline: none !important; box-shadow: none !important; break-after: page; page-break-after: always; margin: 0 !important; }\n      [data-label-page]:last-child { break-after: auto; page-break-after: auto; }\n      [data-label-page][data-skip=\"true\"] { display: none !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-print-root=\"\" style=\"display:flex;flex-wrap:wrap;min-height:100vh;font-family:var(--font-body);color:#0d0d0d;\">\n  <aside data-noprint=\"\" style=\"flex:1 1 340px;max-width:420px;background:#fff;border-right:1px solid var(--border-subtle);padding:28px 24px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n      <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;\">Etiquetas · 4 × 6 in<\u002Fspan>\n      <h1 style=\"margin:0;font-size:28px;font-weight:400;line-height:1.15;\">Preparar <span style=\"font-family:var(--font-accent);font-size:34px;\">envíos<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--ink-600, #555);text-wrap:pretty;\">Importá el CSV de pedidos de Tienda Nube o completá los datos a mano. Cada pedido se imprime en una etiqueta.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n      <x-import component-from-global-scope=\"AMEEsencialDesignSystem_629e8b.Button\" variant=\"primary\" size=\"md\" sc-camel-on-click=\"{{ print }}\" hint-size=\"auto,40px\">{{ printLabel }}<\u002Fx-import>\n      <x-import component-from-global-scope=\"AMEEsencialDesignSystem_629e8b.Button\" variant=\"secondary\" size=\"md\" sc-camel-on-click=\"{{ pickCsv }}\" hint-size=\"auto,40px\">Importar CSV<\u002Fx-import>\n      <input type=\"file\" accept=\".csv,text/csv\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none;\">\n    <\u002Fdiv>\n    <sc-if value=\"{{ importMsg }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;font-size:13px;font-style:italic;border-left:0;padding:10px 12px;background:#f2f2f2;\">{{ importMsg }}<\u002Fp>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-direction:column;gap:8px;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;\">\n        <span style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;\">Pedidos ({{ count }})<\u002Fspan>\n        <div style=\"display:flex;gap:12px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ addOrder }}\" style=\"background:none;border:0;padding:0;font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:#0d0d0d;\" style-hover=\"opacity:.55\">+ Nuevo<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ removeOrder }}\" style=\"background:none;border:0;padding:0;font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:#0d0d0d;\" style-hover=\"opacity:.55\">− Quitar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"1\">\n          <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"font:inherit;font-size:12px;letter-spacing:.06em;padding:6px 10px;border-radius:2px;cursor:pointer;border:1px solid #0d0d0d;background:{{ c.bg }};color:{{ c.fg }};\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px;\">\n      <sc-for list=\"{{ fields }}\" as=\"fl\" hint-placeholder-count=\"10\">\n        <x-import component-from-global-scope=\"AMEEsencialDesignSystem_629e8b.Input\" label=\"{{ fl.label }}\" value=\"{{ fl.value }}\" sc-camel-on-change=\"{{ fl.onChange }}\" multiline=\"{{ fl.multi }}\" rows=\"3\" placeholder=\"{{ fl.ph }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <label style=\"display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;\">\n      <input type=\"checkbox\" checked=\"{{ onlySelected }}\" sc-camel-on-change=\"{{ toggleOnlySelected }}\" style=\"accent-color:#0d0d0d;width:16px;height:16px;\">\n      Imprimir solo el pedido seleccionado\n    <\u002Flabel>\n  <\u002Faside>\n\n  <main data-labels=\"\" style=\"flex:999 1 420px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:32px;padding:40px 24px;background:#f2f2f2;\">\n    <sc-for list=\"{{ labels }}\" as=\"o\" hint-placeholder-count=\"1\">\n      <div data-label-page=\"\" data-skip=\"{{ o.skip }}\" sc-camel-on-click=\"{{ o.select }}\" style=\"width:4in;height:6in;flex:none;box-sizing:border-box;background:#fff;color:#0d0d0d;padding:0.2in 0.22in;display:flex;flex-direction:column;font-family:var(--font-body);cursor:pointer;outline:{{ o.outline }};outline-offset:6px;overflow:hidden;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex:none;\">\n          <img src=\"c569fd37-eadd-4e6f-a004-a0d3398c5726\" alt=\"AME Esencial\" style=\"height:0.42in;width:auto;display:block;\">\n          <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px;\">\n            <span style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;\">Pedido<\u002Fspan>\n            <span style=\"font-size:18px;line-height:1;letter-spacing:.04em;\">{{ o.orden }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:2px;flex:none;background:#0d0d0d;margin:8px 0 9px;\"><\u002Fdiv>\n\n        <span style=\"font-size:9px;letter-spacing:.18em;text-transform:uppercase;flex:none;\">Destinatario<\u002Fspan>\n        <div style=\"font-size:22px;line-height:1.1;margin-top:2px;text-wrap:balance;flex:none;\">{{ o.nombre }}<\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;row-gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid #0d0d0d;flex:none;\">\n          <div style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">Dirección<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.15;\">{{ o.direccion }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">Piso<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;\">{{ o.piso }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">Departamento<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;\">{{ o.depto }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">Entre calles<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.25;\">{{ o.entre }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">Ciudad<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.25;\">{{ o.ciudad }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">CP · Provincia<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.25;\">{{ o.cpProv }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:2px;\">\n            <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">Teléfono<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.15;letter-spacing:.03em;\">{{ o.tel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 auto;min-height:0.9in;margin-top:8px;border:1px solid #0d0d0d;padding:7px 9px;display:flex;flex-direction:column;gap:3px;overflow:hidden;\">\n          <span style=\"font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;\">Observaciones<\u002Fspan>\n          <span style=\"font-size:12.5px;line-height:1.3;text-wrap:pretty;\">{{ o.obs }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showQr }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-top:7px;flex:none;\">\n            {{ o.qrEl }}\n            <div style=\"display:flex;flex-direction:column;gap:3px;min-width:0;\">\n              <span style=\"font-size:15px;line-height:1.15;\">Contanos cómo te fue<\u002Fspan>\n              <span style=\"font-size:10.5px;line-height:1.3;text-wrap:pretty;\">{{ qrCopy }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"flex:none;margin-top:6px;padding-top:5px;border-top:1px solid #0d0d0d;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;\">\n          <span>Remite · {{ remitente }} · {{ remitenteDir }}<\u002Fspan>\n          <span>{{ remitenteTel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showQr&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;QR&quot;},&quot;qrMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;whatsapp&quot;,&quot;link&quot;],&quot;default&quot;:&quot;whatsapp&quot;,&quot;tsType&quot;:&quot;'whatsapp' | 'link'&quot;,&quot;section&quot;:&quot;QR&quot;},&quot;reviewUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://www.ameesencial.com.ar&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;QR&quot;},&quot;remitente&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AME Esencial&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Remitente&quot;},&quot;remitenteDir&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Campos 1792&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Remitente&quot;},&quot;remitenteTel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;11 6694-2709&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Remitente&quot;}}\">\nconst LS_KEY = 'ame-etiquetas-v1';\nconst EMPTY = { orden: '', nombre: '', calle: '', numero: '', piso: '', depto: '', entre: '', ciudad: '', cp: '', provincia: '', tel: '', obs: '' };\nconst SAMPLE = { orden: '1042', nombre: 'Martina Gómez', calle: 'Av. Corrientes', numero: '1847', piso: '6', depto: 'B', entre: 'Callao y Riobamba', ciudad: 'CABA', cp: 'C1045', provincia: 'Buenos Aires', tel: '11 5432-1098', obs: 'Timbre no funciona — llamar al llegar. Dejar en portería si no hay nadie.' };\nconst FIELDS = [\n  ['orden', 'N.º de pedido', '1042'], ['nombre', 'Nombre y apellido', ''], ['calle', 'Calle', ''], ['numero', 'Número', ''],\n  ['piso', 'Piso', ''], ['depto', 'Departamento', ''], ['entre', 'Entre calles', 'Ej. Callao y Riobamba'], ['ciudad', 'Ciudad / localidad', ''],\n  ['cp', 'Código postal', ''], ['provincia', 'Provincia', ''], ['tel', 'Teléfono', ''], ['obs', 'Observaciones', '', true]\n];\nconst norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\\s+/g, ' ').trim();\n\nfunction parseCsv(text) {\n  text = text.replace(/^\\uFEFF/, '');\n  const first = text.split(/\\r?\\n/)[0] || '';\n  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';\n  const rows = []; let row = [], cur = '', q = false;\n  for (let i = 0; i < text.length; i++) {\n    const ch = text[i];\n    if (q) { if (ch === '\"') { if (text[i + 1] === '\"') { cur += '\"'; i++; } else q = false; } else cur += ch; }\n    else if (ch === '\"') q = true;\n    else if (ch === delim) { row.push(cur); cur = ''; }\n    else if (ch === '\\n' || ch === '\\r') { if (ch === '\\r' && text[i + 1] === '\\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }\n    else cur += ch;\n  }\n  if (cur || row.length) { row.push(cur); rows.push(row); }\n  return rows.filter(r => r.some(c => c.trim()));\n}\n\nfunction mapRows(rows) {\n  const head = rows[0].map(norm);\n  const find = (exact, partial) => {\n    for (const e of exact) { const i = head.indexOf(e); if (i >= 0) return i; }\n    for (const p of partial || []) { const i = head.findIndex(h => h.includes(p)); if (i >= 0) return i; }\n    return -1;\n  };\n  const idx = {\n    orden: find(['numero de orden', 'orden', 'pedido', 'numero de pedido'], ['orden']),\n    nombre: find(['nombre para el envio', 'nombre del comprador', 'nombre y apellido', 'nombre'], ['nombre para el envio', 'nombre del comprador', 'destinatario']),\n    calle: find(['direccion', 'calle'], ['direccion']),\n    numero: find(['numero', 'altura'], []),\n    piso: find(['piso', 'piso y departamento'], ['piso']),\n    depto: find(['departamento', 'depto'], ['depto']),\n    entre: find(['entre calles'], ['entre calle']),\n    ciudad: find(['ciudad', 'localidad'], ['ciudad', 'localidad']),\n    cp: find(['codigo postal', 'cp'], ['codigo postal']),\n    provincia: find(['provincia o estado', 'provincia'], ['provincia']),\n    tel: find(['telefono para el envio', 'telefono'], ['telefono']),\n    obs: find(['notas del comprador', 'observaciones', 'notas'], ['nota', 'observ'])\n  };\n  const seen = new Map();\n  rows.slice(1).forEach(r => {\n    const o = {}; Object.keys(EMPTY).forEach(k => { o[k] = idx[k] >= 0 ? String(r[idx[k]] || '').trim() : ''; });\n    const key = o.orden || (o.nombre + o.calle + o.numero);\n    if (!key.trim()) return;\n    if (!seen.has(key)) seen.set(key, o);\n  });\n  return { orders: [...seen.values()], missing: Object.keys(idx).filter(k => idx[k] < 0) };\n}\n\nclass Component extends DCLogic {\n  state = { orders: [{ ...SAMPLE }], sel: 0, importMsg: '', onlySelected: false };\n  fileRef = React.createRef();\n\n  componentDidMount() {\n    try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.orders && s.orders.length) this.setState({ orders: s.orders, sel: Math.min(s.sel || 0, s.orders.length - 1) }); } catch (e) {}\n    if (!window.qrcode) { this._t = setInterval(() => { if (window.qrcode) { clearInterval(this._t); this.forceUpdate(); } }, 200); }\n  }\n  componentWillUnmount() { clearInterval(this._t); }\n  componentDidUpdate(_, ps) { if (ps.orders !== this.state.orders || ps.sel !== this.state.sel) localStorage.setItem(LS_KEY, JSON.stringify({ orders: this.state.orders, sel: this.state.sel })); }\n\n  setField(k, v) { this.setState(s => { const orders = s.orders.slice(); orders[s.sel] = { ...orders[s.sel], [k]: v }; return { orders }; }); }\n\n  onFile = e => {\n    const f = e.target.files && e.target.files[0]; if (!f) return;\n    const read = enc => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsText(f, enc); });\n    read('utf-8').then(t => t.includes('\\uFFFD') ? read('windows-1252') : t).then(t => {\n      const rows = parseCsv(t);\n      if (rows.length < 2) { this.setState({ importMsg: 'El archivo no tiene pedidos.' }); return; }\n      const { orders, missing } = mapRows(rows);\n      if (!orders.length) { this.setState({ importMsg: 'No se encontraron pedidos en el archivo.' }); return; }\n      this.setState({ orders, sel: 0, importMsg: `${orders.length} pedido${orders.length > 1 ? 's' : ''} importado${orders.length > 1 ? 's' : ''}.` + (missing.length ? ` Sin columna para: ${missing.join(', ')} — completalo a mano si hace falta.` : '') });\n    });\n    e.target.value = '';\n  };\n\n  qr(url) {\n    if (!window.qrcode || !url) return '';\n    this._qc = this._qc || new Map();\n    if (this._qc.has(url)) return this._qc.get(url);\n    let src = '';\n    try { const q = window.qrcode(0, 'M'); q.addData(url); q.make(); src = q.createDataURL(10, 0); } catch (e) {}\n    this._qc.set(url, src);\n    return src;\n  }\n  qrEl(url) {\n    const src = this.qr(url);\n    const st = { width: '0.78in', height: '0.78in', flex: 'none', imageRendering: 'pixelated', display: 'block', background: '#fff' };\n    return src ? React.createElement('img', { src, alt: 'QR', style: st }) : React.createElement('div', { style: st });\n  }\n\n  renderVals() {\n    const { orders, sel, onlySelected } = this.state;\n    const cur = orders[sel] || EMPTY;\n    const d = v => (v && String(v).trim()) || '—';\n    const reviewUrl = this.props.reviewUrl ?? 'https://www.ameesencial.com.ar';\n    const showQr = this.props.showQr ?? true;\n    const qrMode = this.props.qrMode ?? 'whatsapp';\n    const tel = this.props.remitenteTel ?? '11 6694-2709';\n    const wa = '549' + String(tel).replace(/\\D/g, '').replace(/^0/, '');\n    const qrUrl = o => qrMode === 'whatsapp'\n      ? `https://wa.me/${wa}?text=${encodeURIComponent(`Hola AME, recibí mi pedido${o.orden ? ' #' + String(o.orden).replace(/^#/, '') : ''}. Les cuento cómo me fue: `)}`\n      : reviewUrl;\n    const labels = orders.map((o, i) => ({\n      orden: o.orden ? '#' + String(o.orden).replace(/^#/, '') : '—',\n      nombre: d(o.nombre),\n      direccion: d([o.calle, o.numero].filter(Boolean).join(' ')),\n      piso: d(o.piso), depto: d(o.depto), entre: d(o.entre), ciudad: d(o.ciudad),\n      cpProv: d([o.cp, o.provincia].filter(Boolean).join(' · ')),\n      tel: d(o.tel), obs: d(o.obs), qrEl: this.qrEl(qrUrl(o)),\n      outline: i === sel && orders.length > 1 ? '1px solid #0d0d0d' : 'none',\n      skip: onlySelected && i !== sel ? 'true' : 'false',\n      select: () => this.setState({ sel: i })\n    }));\n    const n = onlySelected ? 1 : orders.length;\n    return {\n      labels, count: orders.length, showQr,\n      qrCopy: qrMode === 'whatsapp' ? 'Escaneá y escribinos por WhatsApp — tu opinión nos ayuda a crecer.' : 'Escaneá y dejanos tu reseña.',\n      remitente: this.props.remitente ?? 'AME Esencial',\n      remitenteDir: this.props.remitenteDir ?? 'Campos 1792',\n      remitenteTel: tel,\n      importMsg: this.state.importMsg, onlySelected,\n      printLabel: n > 1 ? `Imprimir ${n} etiquetas` : 'Imprimir etiqueta',\n      print: () => window.print(),\n      pickCsv: () => this.fileRef.current && this.fileRef.current.click(),\n      fileRef: this.fileRef, onFile: this.onFile,\n      toggleOnlySelected: () => this.setState(s => ({ onlySelected: !s.onlySelected })),\n      addOrder: () => this.setState(s => ({ orders: [...s.orders, { ...EMPTY }], sel: s.orders.length })),\n      removeOrder: () => this.setState(s => { const orders = s.orders.filter((_, i) => i !== s.sel); return orders.length ? { orders, sel: Math.max(0, s.sel - 1) } : { orders: [{ ...EMPTY }], sel: 0 }; }),\n      chips: orders.map((o, i) => ({ label: o.orden ? '#' + String(o.orden).replace(/^#/, '') : (o.nombre || `Pedido ${i + 1}`), bg: i === sel ? '#0d0d0d' : '#fff', fg: i === sel ? '#fff' : '#0d0d0d', onClick: () => this.setState({ sel: i }) })),\n      fields: FIELDS.map(([k, label, ph, multi]) => ({ label, ph, multi: !!multi, value: cur[k] || '', onChange: e => this.setField(k, e.target.value) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
